name: TBExplorer

options:
  bundleIdPrefix: com.golobitch
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settingGroups:
  tigerbeetle:
    # CTigerBeetle module (tb_client.h + module.modulemap) and the vendored universal static lib.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/tigerbeetle/include
    HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/tigerbeetle/include
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/tigerbeetle/lib

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES

targets:
  TBKit:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/TBKit
    settings:
      groups: [tigerbeetle]
      base:
        # Swift-only library; no Objective-C interface header to install.
        SWIFT_INSTALL_OBJC_HEADER: NO

  TBExplorer:
    type: application
    platform: macOS
    sources:
      - path: Sources/TBExplorer
    dependencies:
      - target: TBKit
    settings:
      groups: [tigerbeetle]
      base:
        PRODUCT_NAME: TigerBeetle Explorer
        PRODUCT_BUNDLE_IDENTIFIER: com.golobitch.tb-explorer
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Sources/TBExplorer/TBExplorer.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: TigerBeetle Explorer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES

  TBKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TBKitTests
    dependencies:
      - target: TBKit
    settings:
      groups: [tigerbeetle]
      base:
        GENERATE_INFOPLIST_FILE: YES

  tb-seed:
    type: tool
    platform: macOS
    sources:
      - path: Tools/tb-seed
    dependencies:
      - target: TBKit
    settings:
      groups: [tigerbeetle]
      base:
        CODE_SIGN_IDENTITY: "-"

schemes:
  TBExplorer:
    build:
      targets:
        TBExplorer: all
        TBKitTests: [test]
    run:
      config: Debug
    test:
      targets:
        - TBKitTests
  tb-seed:
    build:
      targets:
        tb-seed: all
    run:
      config: Debug
      commandLineArguments:
        "--addresses 127.0.0.1:3000": true
