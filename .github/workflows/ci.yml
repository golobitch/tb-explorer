name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - website/**
      - .github/workflows/pages.yml
  pull_request:
    paths-ignore:
      - website/**
      - .github/workflows/pages.yml

env:
  TB_VERSION: 0.17.9
  TB_ADDR: 127.0.0.1:3000

jobs:
  test:
    # Two Xcodes on purpose. macos-15 with Xcode 16.3 is the floor the app claims to support and
    # the toolchain release.yml ships from; xcode-27 matches the machine the app is developed on.
    # Foundation behaviour differs between them — deep link parsing already caught that — so a
    # green local run should not be the only evidence.
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 · Xcode 16.3
            runner: macos-15
            xcode: /Applications/Xcode_16.3.app
          - name: macOS 27 · Xcode 27
            runner: xcode-27
            xcode: ""
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: matrix.xcode != ''
        run: sudo xcode-select -s ${{ matrix.xcode }}

      - name: Toolchain
        run: xcodebuild -version

      - name: Read-only guard
        # The app and TBKit must never write to a cluster; only Tools/tb-seed may create.
        run: |
          if grep -rnE 'CREATE_(ACCOUNTS|TRANSFERS)|create_accounts|create_transfers' Sources; then
            echo "create operations are not allowed in Sources/" >&2
            exit 1
          fi

      - name: Vendored client matches pinned release
        run: test "$(cat Vendor/tigerbeetle/VERSION)" = "$TB_VERSION"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Start TigerBeetle
        run: |
          make tb-format
          nohup .bin/tigerbeetle start --addresses=$TB_ADDR --development .tigerbeetle/0_0.tigerbeetle > .tigerbeetle/server.log 2>&1 &
          for i in $(seq 1 60); do nc -z 127.0.0.1 3000 && break; sleep 1; done

      - name: Seed
        run: make seed TB_ADDR=$TB_ADDR

      - name: Unit and integration tests
        run: make integration TB_ADDR=$TB_ADDR

      # One universal build is enough to prove the shipped configuration compiles; it runs on the
      # image releases are cut from.
      - name: Release build (universal)
        if: matrix.runner == 'macos-15'
        run: make release

      - name: Server log
        if: failure()
        run: tail -100 .tigerbeetle/server.log
