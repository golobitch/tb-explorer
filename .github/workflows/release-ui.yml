name: release-ui

# The macOS app ships on its own tag, so a terminal-UI fix does not rebuild, re-notarize and
# re-publish an app that did not change. Tags look like ui-v0.1.0.
on:
  push:
    tags: ['ui-v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      # A step's own env is not visible to its `if`, so expose signing availability at job level.
      SIGNING_ENABLED: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes are written from the history, which a shallow clone does not have.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Install XcodeGen
        run: brew install xcodegen

      # The tag is the version: ui-v0.1.0 builds as 0.1.0, with the run number as the build number.
      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#ui-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must look like ui-vMAJOR.MINOR.PATCH (e.g. ui-v0.1.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        run: make release VERSION=${{ steps.version.outputs.version }} BUILD_NUMBER=${{ github.run_number }}

      - name: Check app version
        run: |
          PLIST="build/DerivedData/Build/Products/Release/TigerBeetle Explorer.app/Contents/Info.plist"
          ACTUAL=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "Built version $ACTUAL ($BUILD)"
          if [ "$ACTUAL" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::App version $ACTUAL does not match tag ${{ steps.version.outputs.version }}"
            exit 1
          fi

      # Signs with a Developer ID and notarizes only when the secrets are configured;
      # otherwise the ad-hoc signed app is published as-is.
      - name: Sign and notarize
        if: env.SIGNING_ENABLED == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release/TigerBeetle Explorer.app"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          cleanup() { security delete-keychain "$KEYCHAIN" 2>/dev/null || true; rm -f "$RUNNER_TEMP/cert.p12" notarize.zip; }
          trap cleanup EXIT

          # Temporary keychain holding the Developer ID certificate.
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "$MACOS_SIGN_IDENTITY"; then
            echo "::error::Signing identity '$MACOS_SIGN_IDENTITY' not found in the imported certificate. Identities present:"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi

          # Sign with hardened runtime and a secure timestamp (both required for notarization).
          codesign --force --deep --options runtime --timestamp \
            --entitlements ui/Sources/TBExplorer/TBExplorer.entitlements \
            --keychain "$KEYCHAIN" --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Notarize; print Apple's log if the submission is not accepted.
          ditto -c -k --keepParent "$APP" notarize.zip
          RESULT=$(xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --output-format json)
          echo "$RESULT"
          STATUS=$(echo "$RESULT" | jq -r .status)
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization status: $STATUS"
            xcrun notarytool log "$(echo "$RESULT" | jq -r .id)" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            exit 1
          fi

          # Attach the ticket so the app verifies offline, then confirm Gatekeeper accepts it.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Package
        run: |
          ditto -c -k --keepParent "build/DerivedData/Build/Products/Release/TigerBeetle Explorer.app" TigerBeetle-Explorer-macos-universal.zip
          shasum -a 256 TigerBeetle-Explorer-macos-universal.zip > SHA256SUMS

      # The notes are generated rather than left to GitHub: it picks the previous release by date
      # rather than by tag prefix, so this one would baseline against whichever terminal UI release
      # came last and list its commits too.
      - name: Release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" --out release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: TigerBeetle Explorer ${{ steps.version.outputs.version }}
          files: |
            TigerBeetle-Explorer-macos-universal.zip
            SHA256SUMS
          body_path: release-notes.md
          # The website's download button follows /releases/latest, so the app keeps the badge.
          make_latest: true

      # Points the Homebrew cask at the release that was just published.
      - name: Bump the tap
        if: ${{ secrets.TAP_TOKEN != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TAP_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bump-tap.yml',
              ref: context.payload.repository.default_branch,
              inputs: { tag: context.ref.replace('refs/tags/', '') },
            })
